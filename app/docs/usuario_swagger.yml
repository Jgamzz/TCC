Obter lista de usuários
---
tags:
  - Usuários
responses:
  200:
    description: Lista de usuários cadastrados
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          nome:
            type: string
            example: "Ana Silva"
          email:
            type: string
            example: "ana@email.com"